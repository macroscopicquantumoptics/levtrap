[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "levtrap"
version = "0.1.0"
description = "Optical forces on spheres (Mie T-matrix, focused beams): a Python port of a subset of the Optical Tweezers Toolbox v1"
readme = "README.md"
license = { text = "CC-BY-NC-4.0" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
  "License :: Other/Proprietary License",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Source = "https://github.com/macroscopicquantumoptics/levtrap"
"Original OTT" = "https://github.com/ilent2/ott"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
