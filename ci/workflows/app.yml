name: app

on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install levtrap (for the contract test and the local engine)
        working-directory: .
        run: pip install -e .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build (static export under a sub-path)
        run: BASE_PATH=/levtrap/next npm run build
      - name: Browser tests (local engine)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --trace off
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-screenshots
          path: app/tests/screenshots/
          if-no-files-found: ignore
