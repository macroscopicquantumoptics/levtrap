name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: |
          pip install -e ".[test]" build
          pytest -q
      - name: Build the wheel
        run: python -m build --wheel --outdir dist
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pyodide check (wheel loads, OTT benchmark reproduces, solve runs)
        run: |
          npm install --no-save pyodide@0.29.5
          node scripts/pyodide_check.mjs dist/*.whl
      - name: Build the app (app/) for the site's root
        working-directory: app
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: |
          npm ci
          npm run wheel
          npm run build
          # the old site's addresses lead to the app: next/, classic/ and lens.html (E2, docs/PARITY.md)
          node scripts/redirects.ts out "$BASE_PATH"
      - name: Browser check of the app (Pyodide worker)
        working-directory: app
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: |
          npx playwright install --with-deps chromium
          E2E_PYODIDE=1 npx playwright test --trace off
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-screenshots
          path: app/test-results/screenshots/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
